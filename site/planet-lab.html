<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planet Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/planets.css">
<style>body{margin:0;color:#f7f3ff;font-family:"Space Grotesk",system-ui,sans-serif;background:radial-gradient(900px 600px at 20% 10%,#ff8fb833,transparent 60%),radial-gradient(900px 700px at 85% 80%,#9b6bff33,transparent 60%),linear-gradient(180deg,#120c35,#07051a);min-height:100vh;padding:28px max(16px,env(safe-area-inset-left,0px))}
h1{margin:0 0 4px}p{margin:0 0 22px;color:#d6cef0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px;max-width:1100px}
figure{margin:0;text-align:center}figcaption{font-family:VT323,monospace;font-size:1.2rem;color:#fff1a6;letter-spacing:.08em}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body>
<h1>Planet lab</h1><p>Eight painterly planets, each spinning on its own axis. Some have rings, some have moons, some neither.</p>
<div class="grid">
<figure><span class="planet3" data-p="rose" style="--spin:70s"></span><figcaption>ROSE · moon</figcaption></figure>
<figure><span class="planet3" data-p="lavender" style="--spin:55s"></span><figcaption>LAVENDER · ring</figcaption></figure>
<figure><span class="planet3" data-p="cream" style="--spin:80s"></span><figcaption>CREAM · 2 moons</figcaption></figure>
<figure><span class="planet3" data-p="aqua" style="--spin:45s"></span><figcaption>AQUA · plain</figcaption></figure>
<figure><span class="planet3" data-p="dusk" style="--spin:60s"></span><figcaption>DUSK · ring + moon</figcaption></figure>
<figure><span class="planet3" data-p="sand" style="--spin:75s"></span><figcaption>SAND · ring</figcaption></figure>
<figure><span class="planet3" data-p="mint" style="--spin:50s"></span><figcaption>MINT · crossed rings</figcaption></figure>
<figure><span class="planet3" data-p="sky" style="--spin:65s"></span><figcaption>SKY · ring + moon</figcaption></figure>
</div><script src="assets/planets.js"></script></body></html>
