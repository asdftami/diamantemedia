<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planet Lab</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="assets/planets.css">
<style>body{margin:0;color:#f7f3ff;font-family:"Space Grotesk",system-ui,sans-serif;background:radial-gradient(900px 600px at 20% 10%,#ff8fb833,transparent 60%),radial-gradient(900px 700px at 85% 80%,#9b6bff33,transparent 60%),linear-gradient(180deg,#120c35,#07051a);min-height:100vh;padding:28px max(16px,env(safe-area-inset-left,0px))}
h1{margin:0 0 4px}p{margin:0 0 22px;color:#d6cef0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px;max-width:1100px}
figure{margin:0;text-align:center}figure small{display:block;color:#d6cef0;font-size:.8rem;margin-top:2px}figcaption{font-family:VT323,monospace;font-size:1.2rem;color:#fff1a6;letter-spacing:.08em}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body>
<h1>Planet lab</h1><p>Eleven planets, one per stop, in timeline order. Each spins on its own axis; some have rings or moons, some neither.</p>
<div class="grid">
<figure><span class="planet3" data-p="dusk" style="--spin:60s"></span><figcaption>HERO · YOUR GALAXY</figcaption><small>dusk</small></figure>
<figure><span class="planet3" data-p="peach" style="--spin:70s"></span><figcaption>1993 · MONTERREY</figcaption><small>peach</small></figure>
<figure><span class="planet3" data-p="cream" style="--spin:80s"></span><figcaption>2002 · TEXAS</figcaption><small>cream</small></figure>
<figure><span class="planet3" data-p="rose" style="--spin:70s"></span><figcaption>2015 · UTRGV</figcaption><small>rose</small></figure>
<figure><span class="planet3" data-p="mint" style="--spin:50s"></span><figcaption>DENTAL</figcaption><small>mint</small></figure>
<figure><span class="planet3" data-p="lavender" style="--spin:55s"></span><figcaption>PROJECT INSIGHT</figcaption><small>lavender</small></figure>
<figure><span class="planet3" data-p="sky" style="--spin:65s"></span><figcaption>BOND CENTRE</figcaption><small>sky</small></figure>
<figure><span class="planet3" data-p="opal" style="--spin:75s"></span><figcaption>MAKERS LAB</figcaption><small>opal</small></figure>
<figure><span class="planet3" data-p="nebula" style="--spin:45s"></span><figcaption>JARS</figcaption><small>nebula</small></figure>
<figure><span class="planet3" data-p="sand" style="--spin:75s"></span><figcaption>FRIDAYS-OFF</figcaption><small>sand</small></figure>
<figure><span class="planet3" data-p="aqua" style="--spin:45s"></span><figcaption>ABOUT</figcaption><small>aqua</small></figure>
</div><script src="assets/planets.js"></script></body></html>
