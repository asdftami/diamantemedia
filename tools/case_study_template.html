<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · Tami Trevino</title>
<meta name="description" content="{{SUBTITLE}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --space-0:#07051a;--space-1:#120c35;
    --ink:#f7f3ff;--ink-dim:#d6cef0;
    --pink:#ffb3d9;--lilac:#c9b6ff;--butter:#fff1a6;--sky:#a8d8ff;--tiffany:#81d8d0;
    --card:#ffffff0d;--line:#ffffff26;--radius:20px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
  body{margin:0;color:var(--ink);font-family:"Space Grotesk",system-ui,sans-serif;line-height:1.65;
    background:
      radial-gradient(1.2px 1.2px at 12% 18%,#ffb3d9 99%,transparent),radial-gradient(1px 1px at 78% 12%,#a8d8ff 99%,transparent),
      radial-gradient(1.4px 1.4px at 42% 62%,#fff1a6 99%,transparent),radial-gradient(1px 1px at 88% 72%,#81d8d0 99%,transparent),
      radial-gradient(1px 1px at 22% 82%,#c9b6ff 99%,transparent),radial-gradient(1.2px 1.2px at 64% 34%,#fff 99%,transparent),
      radial-gradient(1000px 700px at 80% 0%,#2a1b6e66,transparent 60%),
      linear-gradient(180deg,var(--space-1),var(--space-0) 40%);
    background-attachment:fixed;background-color:var(--space-0)}
  a{color:var(--sky)}
  a:hover{color:var(--butter)}
  :focus-visible{outline:3px solid var(--butter);outline-offset:3px;border-radius:8px}
  .skip{position:fixed;left:16px;top:-60px;z-index:50;background:var(--butter);color:#1a1033;padding:10px 14px;border-radius:10px;font-weight:700;text-decoration:none}
  .skip:focus{top:16px}

  header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px clamp(16px,4vw,40px);
    background:#07051acc;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid #ffffff14}
  .brand{font-weight:700;text-decoration:none;color:var(--ink);white-space:nowrap}
  .brand span{color:var(--pink)}
  nav.actions{display:flex;gap:8px;align-items:center}
  .pill{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid #ffffff40;background:#ffffff10;color:var(--ink);text-decoration:none;font-weight:500}
  .pill:hover{border-color:var(--lilac);color:var(--ink)}
  .pill.primary{background:var(--pink);color:#2a0d22;border-color:var(--pink);font-weight:700}

  .hero{max-width:1100px;margin:0 auto;padding:clamp(40px,8vw,90px) clamp(16px,5vw,40px) 30px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,.6fr);gap:30px;align-items:center}
  .back{font-weight:500;text-decoration:none;color:var(--ink-dim)}
  .label{display:inline-block;font-family:VT323,monospace;font-size:1.2rem;color:#1a1033;background:var(--tiffany);padding:2px 10px;border-radius:6px;margin:18px 0 10px}
  .year{font-family:VT323,monospace;font-size:1.4rem;color:var(--butter);letter-spacing:.06em;margin:0}
  h1{font-size:clamp(2.4rem,6vw,4.4rem);line-height:1.05;margin:6px 0 14px;letter-spacing:-.01em}
  .subtitle{font-size:clamp(1.1rem,2vw,1.4rem);color:var(--ink-dim);margin:0 0 10px;max-width:40ch}
  .role{color:var(--lilac);font-weight:500;margin:0}
  .planet{width:min(260px,100%);aspect-ratio:1;border-radius:50%;margin:0 auto;position:relative;
    background:radial-gradient(circle at 32% 28%,#fff8 0,#fff0 22%),radial-gradient(circle at 50% 50%,var(--c1),var(--c2) 70%,#120a2e 100%);
    box-shadow:0 0 60px var(--glow),inset -24px -30px 60px #0007}
  .planet::after{content:"";position:absolute;width:118%;height:26%;left:-9%;top:37%;border-radius:50%;border:5px solid var(--ring);transform:rotate(-14deg)}
  .p-dental{--c1:#d6f6ff;--c2:#3aa0d8;--glow:#a8d8ff66;--ring:#81d8d0aa}
  .p-insight{--c1:#c9b6ff;--c2:#4b3bc9;--glow:#c9b6ff77;--ring:#ffb3d9aa}
  .p-bond{--c1:#a8d8ff;--c2:#2b4fb8;--glow:#a8d8ff66;--ring:#fff1a6aa}
  .p-fridays{--c1:#f5f3ef;--c2:#c7a77c;--glow:#d8c3a566;--ring:#3b2a20aa}

  main.cs{max-width:820px;margin:0 auto;padding:0 clamp(16px,5vw,40px) 60px}
  main.cs h2{font-size:clamp(1.6rem,3.4vw,2.2rem);margin:56px 0 12px;line-height:1.15}
  main.cs h2::before{content:"✦ ";color:var(--pink)}
  main.cs h3{font-size:1.25rem;margin:32px 0 8px;color:var(--butter)}
  main.cs p,main.cs li{color:var(--ink-dim);font-size:1.06rem}
  main.cs strong{color:var(--ink)}
  main.cs hr{border:0;height:1px;background:linear-gradient(90deg,transparent,#ffffff40,transparent);margin:48px 0}
  blockquote{margin:24px 0;padding:18px 22px;border-radius:16px;background:linear-gradient(135deg,#ffb3d922,#c9b6ff22);border-left:4px solid var(--pink)}
  blockquote p{margin:0;font-size:1.2rem!important;color:var(--ink)!important}
  .table-wrap{overflow-x:auto;margin:20px 0;border-radius:16px;border:1px solid var(--line);background:var(--card)}
  table{border-collapse:collapse;width:100%;min-width:420px}
  th,td{padding:12px 14px;text-align:left;vertical-align:top;border-bottom:1px solid #ffffff14;color:var(--ink-dim)}
  th{color:var(--ink);font-weight:700;background:#ffffff0a}
  tr:last-child td{border-bottom:0}
  code{font-family:VT323,monospace;font-size:1.15em;color:var(--tiffany)}
  pre{background:#a9c48a;color:#1b2a12;padding:18px;border-radius:16px;overflow-x:auto;box-shadow:inset 0 0 0 3px #0002}
  pre code{color:inherit;font-size:1.2rem;line-height:1.25}
  .impact{margin:8px 0 34px;padding:22px 24px;border-radius:var(--radius);background:linear-gradient(135deg,#fff1a61f,#ffb3d91f);border:1.5px solid var(--butter);box-shadow:0 0 40px #fff1a614}
  .impact .impact-label{font-family:VT323,monospace;font-size:1.3rem;letter-spacing:.12em;text-transform:uppercase;color:var(--butter);margin:0 0 6px}
  .impact p{margin:0;font-size:clamp(1.12rem,1.8vw,1.3rem)!important;line-height:1.55;color:var(--ink)!important}
  main.cs .impact strong{color:var(--butter)}
  .pair .gallery{grid-template-columns:1fr 1fr;max-width:520px;margin-left:auto;margin-right:auto;gap:14px}
  .pair figure{display:flex;flex-direction:column}
  .pair .zoom-hint{margin-top:auto;align-self:flex-start}
  .pair figcaption{padding-bottom:6px}
  .pair figure img{width:100%;height:220px;max-height:none;object-fit:contain;object-position:center}
  .pair figcaption{font-size:.85rem}
  .pair.wide .gallery{max-width:none}
  .pair.wide figure img{height:auto;aspect-ratio:16/10}
  .pair.portrait .gallery{max-width:560px}
  .pair.portrait figure img{height:auto;aspect-ratio:1493/2000}
  .pair.trio .gallery{grid-template-columns:repeat(3,minmax(0,1fr))}
  @media (max-width:640px){.pair.trio .gallery{grid-template-columns:1fr 1fr}}
  figure img{cursor:zoom-in}
  .zoom-hint{display:inline-block;margin:8px 6px 0;font-size:.8rem;font-weight:700;color:var(--tiffany);cursor:zoom-in}
  dialog.zoom{max-width:96vw;max-height:94vh;padding:0;border:0;border-radius:16px;background:#0d0a26}
  dialog.zoom::backdrop{background:#04031099}
  dialog.zoom img{display:block;max-width:96vw;max-height:88vh;background:#fff}
  dialog.zoom button{position:absolute;top:10px;right:10px;min-height:44px;padding:0 16px;border-radius:999px;border:0;background:var(--butter);color:#1a1033;font:inherit;font-weight:700;cursor:pointer}
  @media (max-width:420px){.pair .gallery{grid-template-columns:1fr}}
  ol.learnings{list-style:none;counter-reset:l;padding:0;margin:20px 0 10px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  ol.learnings li{counter-increment:l;position:relative;padding:18px 18px 18px 58px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line);margin:0;line-height:1.55}
  ol.learnings li::before{content:counter(l);position:absolute;left:16px;top:16px;width:28px;height:28px;border-radius:50%;border:2px solid var(--pink);color:var(--pink);font-weight:700;font-size:.9rem;display:grid;place-items:center}
  @media (max-width:640px){ol.learnings{grid-template-columns:1fr}}
  .gallery{display:grid;gap:22px;margin:26px 0}
  figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px;overflow:hidden}
  figure img{display:block;max-width:100%;max-height:78vh;width:auto;height:auto;margin:0 auto;border-radius:12px;background:#fff}
  figcaption{font-size:.92rem;color:var(--ink-dim);padding:10px 6px 2px}

  .pagers{max-width:820px;margin:0 auto;padding:0 clamp(16px,5vw,40px) 80px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .pager{display:grid;gap:4px;padding:18px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line);text-decoration:none;color:var(--ink-dim)}
  .pager strong{color:var(--ink);font-size:1.1rem}
  .pager:hover{border-color:var(--pink);color:var(--ink-dim)}
  .pagers .pager:last-child{text-align:right}
  .cta{max-width:820px;margin:0 auto 40px;padding:28px clamp(16px,5vw,40px);text-align:center}
  .cta a{margin:6px}

  @media (max-width:760px){
    .hero{grid-template-columns:1fr}
    .planet{width:160px;order:-1;margin:0}
    .hide-sm{display:none}
    .pagers{grid-template-columns:1fr}
    .pagers .pager:last-child{text-align:left}
  }
</style>
</head>
<body>
<a class="skip" href="#content">Skip to the case study</a>
<header class="top">
  <a class="brand" href="../index.html">Tami Trevino <span>✦</span></a>
  <nav class="actions" aria-label="Quick links">
    <a class="pill" href="../index.html#work">Work</a>
    <a class="pill hide-sm" href="../index.html#origin">About</a>
    <a class="pill hide-sm" href="../index.html#message">Resume</a>
    <a class="pill primary" href="../index.html#contact">Contact</a>
  </nav>
</header>

<section class="hero" aria-labelledby="cs-title">
  <div>
    <a class="back" href="../index.html#work">← Back to the galaxy</a><br>
    <span class="label">CASE STUDY {{NUM}}</span>
    <p class="year">{{YEAR}}</p>
    <h1 id="cs-title">{{TITLE}}</h1>
    <p class="subtitle">{{SUBTITLE}}</p>
    <p class="role">{{ROLE}}</p>
  </div>
  <div class="planet {{PLANET}}" aria-hidden="true"></div>
</section>

<main class="cs" id="content">
{{BODY}}
</main>

<section class="cta" aria-label="Get in touch">
  <p>Like what you see?</p>
  <a class="pill primary" href="../index.html#contact">Message me</a>
  <a class="pill" href="../index.html#message">Request my resume</a>
</section>

<nav class="pagers" aria-label="More case studies">
  {{PREV}}
  {{NEXT}}
</nav>
<dialog class="zoom" aria-label="Enlarged image"><button type="button" autofocus>Close ✕</button><img alt=""></dialog>
<script>
(()=>{const d=document.querySelector('dialog.zoom'),big=d.querySelector('img');
document.querySelectorAll('main.cs figure img').forEach(img=>{
  img.tabIndex=0;img.setAttribute('role','button');img.setAttribute('aria-label','Enlarge image: '+img.alt);
  const open=()=>{big.src=img.src;big.alt=img.alt;d.showModal()};
  img.addEventListener('click',open);
  const h=document.createElement('span');h.className='zoom-hint';h.setAttribute('aria-hidden','true');h.textContent='⤢ Click to enlarge';h.addEventListener('click',open);
  img.closest('figure').appendChild(h);
  img.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}});
});
d.querySelector('button').addEventListener('click',()=>d.close());
d.addEventListener('click',e=>{if(e.target===d)d.close()});})();
</script>
</body>
</html>
